<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Network SRT Caption Fixture</title>
    <style>
      body {
        margin: 0;
        color: #f8fafc;
        background: #111827;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 32px;
      }

      .player {
        position: relative;
        width: min(960px, 100%);
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(15, 118, 110, 0.32), transparent),
          radial-gradient(circle at 68% 30%, rgba(248, 250, 252, 0.18), transparent 34%),
          #020617;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      }

      .player::before {
        content: "Page fetches SRT subtitles";
        position: absolute;
        left: 24px;
        top: 20px;
        color: rgba(248, 250, 252, 0.76);
        font-size: 14px;
      }

      video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      canvas {
        display: none;
      }

      .readout {
        position: absolute;
        left: 24px;
        bottom: 24px;
        padding: 8px 12px;
        border-radius: 4px;
        color: #111827;
        background: #f8fafc;
        font-weight: 700;
      }

      .hint {
        margin-top: 18px;
        color: #cbd5e1;
        font-size: 14px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <div class="player">
          <canvas id="fixture-canvas" width="960" height="540"></canvas>
          <video id="fixture-video" muted autoplay playsinline></video>
          <div class="readout">00:00</div>
        </div>
        <p class="hint">
          This page fetches a SubRip SRT subtitle file from page JavaScript. The extension should intercept and parse SRT cues into the Live Transcript overlay.
        </p>
      </section>
    </main>
    <script>
      const canvas = document.querySelector('#fixture-canvas');
      const context = canvas.getContext('2d');
      const video = document.querySelector('#fixture-video');
      const readout = document.querySelector('.readout');

      video.srcObject = canvas.captureStream(15);
      video.play().catch(() => {});

      async function fetchCaptions() {
        await fetch('./fixtures/captions.srt?kind=subtitles');
      }

      function drawFrame() {
        const seconds = Math.floor(video.currentTime);
        const gradient = context.createLinearGradient(0, 0, canvas.width, canvas.height);
        gradient.addColorStop(0, '#0f766e');
        gradient.addColorStop(1, '#020617');
        context.fillStyle = gradient;
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.fillStyle = 'rgba(248, 250, 252, 0.92)';
        context.font = '700 42px system-ui, sans-serif';
        context.fillText('Network SRT subtitle fixture', 48, 96);
        context.font = '600 30px system-ui, sans-serif';
        context.fillText(`Playback clock: 00:${String(seconds).padStart(2, '0')}`, 48, 150);
      }

      window.setInterval(() => {
        drawFrame();
        readout.textContent = `00:${String(Math.floor(video.currentTime)).padStart(2, '0')}`;
      }, 250);

      drawFrame();
      window.setTimeout(fetchCaptions, 300);
    </script>
  </body>
</html>
