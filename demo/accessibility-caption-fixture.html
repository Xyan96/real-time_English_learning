<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accessibility Caption Fixture</title>
    <style>
      body {
        margin: 0;
        color: #f8fafc;
        background: #111827;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 32px;
      }

      .player {
        position: relative;
        width: min(960px, 100%);
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(168, 85, 247, 0.24), transparent),
          radial-gradient(circle at 68% 30%, rgba(248, 250, 252, 0.18), transparent 34%),
          #020617;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      }

      .player::before {
        content: "Page renders captions in an aria-live accessibility region";
        position: absolute;
        left: 24px;
        top: 20px;
        color: rgba(248, 250, 252, 0.76);
        font-size: 14px;
      }

      video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      canvas {
        display: none;
      }

      .captions-region {
        position: absolute;
        left: 80px;
        right: 80px;
        bottom: 64px;
        padding: 12px 16px;
        border-radius: 4px;
        color: #f8fafc;
        background: rgba(2, 6, 23, 0.78);
        font-size: 28px;
        font-weight: 700;
        text-align: center;
      }

      .hint {
        margin-top: 18px;
        color: #cbd5e1;
        font-size: 14px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <div class="player">
          <canvas id="fixture-canvas" width="960" height="540"></canvas>
          <video id="fixture-video" muted autoplay playsinline></video>
          <div class="captions-region" aria-live="polite" aria-label="English captions"></div>
        </div>
        <p class="hint">
          This page exposes the visible caption text through an aria-live region instead of subtitle-specific classes. The extension should still collect it.
        </p>
      </section>
    </main>
    <script>
      const canvas = document.querySelector('#fixture-canvas');
      const context = canvas.getContext('2d');
      const video = document.querySelector('#fixture-video');
      const captions = document.querySelector('.captions-region');

      video.srcObject = canvas.captureStream(15);
      video.play().catch(() => {});

      function drawFrame() {
        const seconds = Math.floor(video.currentTime);
        const gradient = context.createLinearGradient(0, 0, canvas.width, canvas.height);
        gradient.addColorStop(0, '#7e22ce');
        gradient.addColorStop(1, '#020617');
        context.fillStyle = gradient;
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.fillStyle = 'rgba(248, 250, 252, 0.92)';
        context.font = '700 42px system-ui, sans-serif';
        context.fillText('Accessibility caption fixture', 48, 96);
        context.font = '600 30px system-ui, sans-serif';
        context.fillText(`Playback clock: 00:${String(seconds).padStart(2, '0')}`, 48, 150);
      }

      function updateCaption() {
        captions.textContent = video.currentTime >= 1
          ? 'Accessibility caption from aria live region.'
          : '';
      }

      window.setInterval(() => {
        drawFrame();
        updateCaption();
      }, 250);

      drawFrame();
    </script>
  </body>
</html>
