<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iframe Player Caption Fixture</title>
    <style>
      body {
        margin: 0;
        color: #f8fafc;
        background: #101820;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 32px;
      }

      .shell {
        width: min(1000px, 100%);
      }

      iframe {
        width: 100%;
        aspect-ratio: 16 / 9;
        border: 0;
        border-radius: 8px;
        background: #020617;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      }

      .hint {
        margin-top: 18px;
        color: #cbd5e1;
        font-size: 14px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="shell">
        <iframe title="Embedded video player" src="./caption-fixture.html"></iframe>
        <p class="hint">
          This page embeds the video player in an iframe. The extension should inject into that frame and collect its existing rendered captions.
        </p>
      </section>
    </main>
  </body>
</html>
