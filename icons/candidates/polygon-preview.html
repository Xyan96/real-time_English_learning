<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>多边形图标备选</title>
    <style>
      body {
        margin: 0;
        padding: 28px;
        color: #111827;
        background: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      h1 {
        margin: 0 0 18px;
        font-size: 18px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(5, 128px);
        gap: 22px;
        align-items: start;
      }

      figure {
        display: grid;
        gap: 10px;
        margin: 0;
        justify-items: center;
      }

      img {
        width: 128px;
        height: 128px;
        border-radius: 28px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.16);
      }

      figcaption {
        font-size: 13px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <h1>多边形图标备选</h1>
    <div class="grid">
      <figure><img src="./polygon-1.svg" alt="方案 1"><figcaption>方案 1</figcaption></figure>
      <figure><img src="./polygon-2.svg" alt="方案 2"><figcaption>方案 2</figcaption></figure>
      <figure><img src="./polygon-3.svg" alt="方案 3"><figcaption>方案 3</figcaption></figure>
      <figure><img src="./polygon-4.svg" alt="方案 4"><figcaption>方案 4</figcaption></figure>
      <figure><img src="./polygon-5.svg" alt="方案 5"><figcaption>方案 5</figcaption></figure>
    </div>
  </body>
</html>
